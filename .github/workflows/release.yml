name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - name: Docusaurus production build and embedded-site consistency
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack prepare pnpm@12.18.0 --activate
          scripts/build-docs.sh --check
          scripts/audit-docs-dependencies.sh
      - name: Docusaurus accessibility and responsive audit
        run: |
          corepack pnpm --dir website exec playwright install --with-deps chromium
          corepack pnpm --dir website test:a11y
      # Repeat the administrative gate against the tagged release source.
      - name: Administrative console UI and real App OAuth integration
        timeout-minutes: 8
        env:
          IVOAI_ADMIN_UI_NODE_MODULES: ${{ github.workspace }}/website/node_modules
        run: scripts/test-admin-console-ci.sh
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high --prefix internal/components/assets
      - name: Patched braces regression fixtures
        run: bash scripts/test-braces.sh
      - name: Reviewed deepmerge destination prototype protection
        run: node --test scripts/test-deepmerge.cjs
      - name: Reviewed Zod V3 compatibility security fixtures
        env:
          IVOAI_ZOD_TSC: ${{ github.workspace }}/website/node_modules/.bin/tsc
        run: bash scripts/test-zod3-compat.sh
      - name: Non-executing intake and documentation comparison fixtures
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Reviewed Graft build and ABI fixtures
        run: |
          python3 scripts/test-build-managed-graft.py
          python3 scripts/test-graft-abi.py
      - name: Generated CLI reference is current
        run: scripts/generate-cli-reference.sh --check
      - name: Tests, race, and vet
        run: |
          go test ./...
          go test -race -timeout 20m ./...
          go vet ./...
      - name: Protected evidence recovery rollback against pinned legacy Core
        # Required before build/publish, using the tag's current Core and exact
        # historical source. Missing history/cache/proof cannot become a skip.
        run: scripts/test-protected-evidence-rollback.sh
      - name: Prepare isolated native client protocol gates
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor python3 curl qemu-user
          scripts/setup-ci-graft-sandbox.sh
      - name: Removed legacy paths and native Core admission
        run: go test ./internal/app ./internal/cli ./internal/components ./internal/session ./internal/doctor -run 'Test(RemovedOpenCode|AutoAlias|DoctorRetainsLegacy|LegacyOpenCodeMetadata|NativeProviderMigration)' -count=1
      - name: Native Codex TUI and fail-closed App Server admission
        run: scripts/test-native-codex.sh
      - name: Official Claude readonly worker delegation boundary
        run: scripts/test-claude-worker-tools.sh --output "$PWD/dist/claude-worker-proof"
      - name: ShellCheck
        run: shellcheck install.sh scripts/*.sh
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - name: Install idempotency smoke
        env:
          IVOAI_SMOKE_TARGET: release
        run: scripts/install-smoke.sh
      - name: v0.5.0 upgrade and rollback gate
        run: scripts/upgrade-matrix.sh

  build:
    needs: verify
    runs-on: ${{ matrix.runner }}
    # Includes bounded cold component setup and the real stable-upgrade gate.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install non-AVX CPU smoke dependency
        if: matrix.goarch == 'amd64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
      - name: Install reviewed Graft build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor binutils gcc-12 g++-12 make python3 patch openssl
      - name: Admit only the CI sandbox launcher to user namespaces
        run: scripts/setup-ci-graft-sandbox.sh
      - name: Exact official native Codex pair and native protocol gates
        run: scripts/test-native-codex.sh
      - name: Build and qualify reviewed Caveman runtime
        run: |
          scripts/build-managed-caveman.sh "$PWD/dist/release"
          mkdir -p "$RUNNER_TEMP/ivoai-caveman-proof"
          scripts/test-managed-caveman.sh \
            "$PWD/dist/release/ivoai-caveman_linux_${{ matrix.goarch }}.tar.gz" \
            "$PWD/dist/release/ivoai-caveman_linux_${{ matrix.goarch }}.metadata.json" \
            "$RUNNER_TEMP/ivoai-caveman-proof/qualification.json"
      - name: Retain Caveman binary and installer qualification
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: caveman-release-${{ matrix.goarch }}
          path: ${{ runner.temp }}/ivoai-caveman-proof/qualification.json
          if-no-files-found: error
      - name: Build compatible managed Graft and verify baseline CPU
        env:
          GRAFT_GCC_MAJOR: "12"
        run: |
          scripts/build-managed-graft.sh "$PWD/dist/release"
          scripts/test-graft-baseline.sh \
            "$PWD/dist/release/ivoai-graft_linux_${{ matrix.goarch }}.tar.gz" \
            "$PWD/dist/release/managed-graft-${{ matrix.goarch }}.json"
          scripts/test-managed-graft.sh \
            "$PWD/dist/release/ivoai-graft_linux_${{ matrix.goarch }}.tar.gz" \
            "$PWD/dist/release/managed-graft-${{ matrix.goarch }}.json"
      - name: Build archive
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          caveman_metadata="dist/release/ivoai-caveman_linux_${GOARCH}.metadata.json"
          caveman_url="https://github.com/ivo-lopes/ivoai/releases/download/${VERSION}/ivoai-caveman_${GOOS}_${GOARCH}.tar.gz"
          caveman_build="$(jq -c --arg url "$caveman_url" '. + {url:$url}' "$caveman_metadata" | base64 -w0)"
          graft_metadata="dist/release/managed-graft-${GOARCH}.json"
          graft_url="https://github.com/ivo-lopes/ivoai/releases/download/${VERSION}/ivoai-graft_${GOOS}_${GOARCH}.tar.gz"
          graft_build="$(jq -c --arg url "$graft_url" '. + {url:$url}' "$graft_metadata" | base64 -w0)"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION#v} -X github.com/ivo-lopes/ivoai/internal/components.managedCavemanBuild=${caveman_build} -X github.com/ivo-lopes/ivoai/internal/components.managedGraftBuild=${graft_build}" -o dist/ivoai ./cmd/ivoai
          go version -m dist/ivoai | grep -F 'vcs.modified=false'
          # Execute this exact Core before archiving. The amd64 emulator has no
          # AVX/AVX2; the ARM job runs on its native architecture.
          core_command=("$PWD/dist/ivoai")
          if [[ "$GOARCH" == amd64 ]]; then
            core_command=(qemu-x86_64 -cpu Nehalem "$PWD/dist/ivoai")
          fi
          smoke_root="$(mktemp -d)"
          trap 'rm -rf -- "$smoke_root"' EXIT
          mkdir -p "$smoke_root"/{home,config,data,state,cache,tmp}
          core_env=(env -i PATH="$PATH" HOME="$smoke_root/home" XDG_CONFIG_HOME="$smoke_root/config" XDG_DATA_HOME="$smoke_root/data" XDG_STATE_HOME="$smoke_root/state" XDG_CACHE_HOME="$smoke_root/cache" TMPDIR="$smoke_root/tmp" NO_COLOR=1)
          actual_version="$("${core_env[@]}" timeout 60 "${core_command[@]}" version)"
          [[ "$actual_version" == "${VERSION#v}" ]]
          "${core_env[@]}" timeout 60 "${core_command[@]}" help > "$smoke_root/help.txt"
          test -s "$smoke_root/help.txt"
          tar -C dist -czf "dist/release/ivoai_${GOOS}_${GOARCH}.tar.gz" ivoai
      - name: Upgrade from the previous stable Core and roll back
        id: stable_upgrade
        if: ${{ !contains(github.ref_name, '-') }}
        timeout-minutes: 105
        env:
          CANDIDATE_VERSION: ${{ github.ref_name }}
          RELEASE_ARCH: ${{ matrix.goarch }}
        run: |
          baseline_root="$(mktemp -d "$RUNNER_TEMP/ivoai-previous-stable.XXXXXXXX")"
          trap 'rm -rf -- "$baseline_root"' EXIT
          case "$RELEASE_ARCH" in
            amd64) baseline_sha=9c667cfa5c9cb0e2df4458885023ab7a9795bec595bab3bb8a85af53a8c812fe ;;
            arm64) baseline_sha=56cc1ab898bc72eb0214acdc429c7523af6db7c3303a4371d96214cbcaa09d2f ;;
            *) exit 1 ;;
          esac
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/ivo-lopes/ivoai/releases/download/v0.16.0/ivoai_linux_${RELEASE_ARCH}.tar.gz" \
            -o "$baseline_root/core.tar.gz"
          printf '%s  %s\n' "$baseline_sha" "$baseline_root/core.tar.gz" | sha256sum --check --strict -
          tar -xzf "$baseline_root/core.tar.gz" -C "$baseline_root" ivoai
          scripts/test-stable-release-upgrade.sh \
            --baseline-core "$baseline_root/ivoai" --candidate-dir "$PWD/dist/release" \
            --version "${CANDIDATE_VERSION#v}" \
            --output "$RUNNER_TEMP/ivoai-stable-upgrade-$RELEASE_ARCH"
      - name: Retain stable upgrade verification
        if: ${{ always() && (steps.stable_upgrade.outcome == 'success' || steps.stable_upgrade.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-upgrade-${{ matrix.goarch }}
          path: ${{ runner.temp }}/ivoai-stable-upgrade-${{ matrix.goarch }}/qualification.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ivoai-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/release/*

  skill:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package Web skill
        run: scripts/package-skill.sh ./ivoai-memory-context.zip
      - name: Validate skill archive
        run: unzip -t ivoai-memory-context.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ivoai-memory-context-skill
          path: ivoai-memory-context.zip

  publish:
    needs: [build, skill]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ivoai-*
          merge-multiple: true
          path: dist/downloaded-assets
      - name: Select only the public release payloads
        run: |
          # Preserve build sidecars in the downloaded artifacts. Only this
          # explicit payload set enters publication and its strict verifier.
          mkdir -p dist/publish
          release_assets=(
            ivoai_linux_amd64.tar.gz ivoai_linux_arm64.tar.gz
            ivoai-caveman_linux_amd64.tar.gz ivoai-caveman_linux_arm64.tar.gz
            ivoai-caveman_linux_amd64.metadata.json ivoai-caveman_linux_arm64.metadata.json
            ivoai-graft_linux_amd64.tar.gz ivoai-graft_linux_arm64.tar.gz
            managed-graft-amd64.json managed-graft-arm64.json
            ivoai-memory-context.zip
          )
          for asset in "${release_assets[@]}"; do
            test -f "dist/downloaded-assets/$asset"
            test ! -L "dist/downloaded-assets/$asset"
            cp -- "dist/downloaded-assets/$asset" "dist/publish/$asset"
          done
      - name: Generate checksums
        working-directory: dist/publish
        run: sha256sum ivoai_*.tar.gz ivoai-caveman_*.tar.gz ivoai-caveman_*.metadata.json ivoai-graft_*.tar.gz managed-graft-*.json ivoai-memory-context.zip > checksums.txt
      - name: Verify local release assets against the tagged source
        run: |
          mkdir -p "$RUNNER_TEMP/ivoai-release-verification"
          python3 scripts/verify-release-artifacts.py \
            --directory "$PWD/dist/publish" --version "${GITHUB_REF_NAME#v}" \
            --source "$(git rev-parse HEAD)" --source-tree "$PWD" \
            --output "$RUNNER_TEMP/ivoai-release-verification/local.json"
      - name: Stage and verify GitHub draft release
        working-directory: dist/publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="$GITHUB_WORKSPACE/release-notes/${GITHUB_REF_NAME}.md"
          test -s "$notes_file"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists; refusing to replace immutable assets" >&2
            exit 1
          fi
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          # Upload into a draft first. A failed upload must never leave a
          # partially populated public release under an immutable tag.
          gh release create "${GITHUB_REF_NAME}" ivoai_*.tar.gz ivoai-caveman_*.tar.gz ivoai-caveman_*.metadata.json ivoai-graft_*.tar.gz managed-graft-*.json ivoai-memory-context.zip checksums.txt --verify-tag --draft --notes-file "$notes_file" "${release_flags[@]}"
          mapfile -t actual_assets < <(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | sort)
          mapfile -t expected_assets < <(printf '%s\n' checksums.txt ivoai-memory-context.zip ivoai_linux_amd64.tar.gz ivoai_linux_arm64.tar.gz ivoai-caveman_linux_amd64.tar.gz ivoai-caveman_linux_arm64.tar.gz ivoai-caveman_linux_amd64.metadata.json ivoai-caveman_linux_arm64.metadata.json ivoai-graft_linux_amd64.tar.gz ivoai-graft_linux_arm64.tar.gz managed-graft-amd64.json managed-graft-arm64.json | sort)
          if [[ "${actual_assets[*]}" != "${expected_assets[*]}" ]]; then
            echo "draft release asset set is incomplete; leaving draft unpublished" >&2
            printf 'expected: %s\nactual: %s\n' "${expected_assets[*]}" "${actual_assets[*]}" >&2
            exit 1
          fi
          verify_root="$RUNNER_TEMP/ivoai-release-verification"
          download_root="$(mktemp -d "$RUNNER_TEMP/ivoai-release-download.XXXXXXXX")"
          trap 'rm -rf -- "$download_root"' EXIT
          # Tag lookup may return 404 for an unpublished draft. Resolve its
          # REST database ID from the authenticated release list instead.
          release_database_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\" and .draft == true) | .id")"
          [[ "$release_database_id" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_database_id" > "$verify_root/draft-api.json"
          gh release download "$GITHUB_REF_NAME" --dir "$download_root"
          cmp checksums.txt "$download_root/checksums.txt"
          (
            cd "$download_root"
            sha256sum --check --strict checksums.txt
          )
          python3 "$GITHUB_WORKSPACE/scripts/verify-release-artifacts.py" \
            --directory "$download_root" --version "${GITHUB_REF_NAME#v}" \
            --source "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --source-tree "$GITHUB_WORKSPACE" --api-json "$verify_root/draft-api.json" \
            --output "$verify_root/downloaded.json"
      - name: Retain pre-publication verification receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-asset-verification
          path: ${{ runner.temp }}/ivoai-release-verification/*
          if-no-files-found: error
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # All local/downloaded byte and metadata gates succeeded. A failure
          # before this step leaves the exact draft unpublished for inspection.
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
