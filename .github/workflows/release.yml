name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"
      - name: Docusaurus production build and embedded-site consistency
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack prepare pnpm@12.11.2 --activate
          scripts/build-docs.sh --check
          scripts/audit-docs-dependencies.sh
      - name: Docusaurus accessibility and responsive audit
        run: |
          corepack pnpm --dir website exec playwright install --with-deps chromium
          corepack pnpm --dir website test:a11y
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high --prefix internal/components/assets
      - name: Patched braces regression fixtures
        run: bash scripts/test-braces.sh
      - name: Non-executing intake and documentation comparison fixtures
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Reviewed Graft build and ABI fixtures
        run: |
          python3 scripts/test-build-managed-graft.py
          python3 scripts/test-graft-abi.py
      - name: Generated CLI reference is current
        run: scripts/generate-cli-reference.sh --check
      - name: Tests, race, and vet
        run: |
          go test ./...
          go test -race -timeout 20m ./...
          go vet ./...
      - name: Managed OpenCode HTTP and attach integration
        run: |
          node --test internal/opencodebridge/keyboard.test.mjs
          scripts/test-managed-opencode.sh
      - name: Native Codex TUI and fail-closed App Server admission
        run: scripts/test-native-codex.sh
      - name: ShellCheck
        run: shellcheck install.sh scripts/*.sh
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - name: Install idempotency smoke
        env:
          IVOAI_SMOKE_TARGET: release
        run: scripts/install-smoke.sh
      - name: v0.5.0 upgrade and rollback gate
        run: scripts/upgrade-matrix.sh

  build:
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install non-AVX CPU smoke dependency
        if: matrix.goarch == 'amd64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
      - name: Build and verify patched managed frontend
        run: |
          scripts/build-managed-opencode.sh "$PWD/dist/release"
          scripts/test-opencode-baseline.sh \
            "$PWD/dist/release/ivoai-opencode_linux_${{ matrix.goarch }}.tar.gz" \
            "$PWD/dist/release/managed-opencode-${{ matrix.goarch }}.json"
          scripts/test-patched-opencode.sh \
            "$PWD/dist/release/ivoai-opencode_linux_${{ matrix.goarch }}.tar.gz" \
            "$PWD/dist/release/managed-opencode-${{ matrix.goarch }}.json"
      - name: Install reviewed Graft build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap binutils gcc-12 g++-12 make python3 patch
      - name: Build compatible managed Graft and verify baseline CPU
        env:
          GRAFT_GCC_MAJOR: "12"
        run: |
          scripts/build-managed-graft.sh "$PWD/dist/release"
          scripts/test-graft-baseline.sh \
            "$PWD/dist/release/ivoai-graft_linux_${{ matrix.goarch }}.tar.gz" \
            "$PWD/dist/release/managed-graft-${{ matrix.goarch }}.json"
      - name: Build archive
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          metadata="dist/release/managed-opencode-${GOARCH}.json"
          url="https://github.com/ivo-lopes/ivoai/releases/download/${VERSION}/ivoai-opencode_${GOOS}_${GOARCH}.tar.gz"
          managed_build="$(jq -c --arg url "$url" '. + {url:$url}' "$metadata" | base64 -w0)"
          graft_metadata="dist/release/managed-graft-${GOARCH}.json"
          graft_url="https://github.com/ivo-lopes/ivoai/releases/download/${VERSION}/ivoai-graft_${GOOS}_${GOARCH}.tar.gz"
          graft_build="$(jq -c --arg url "$graft_url" '. + {url:$url}' "$graft_metadata" | base64 -w0)"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION#v} -X github.com/ivo-lopes/ivoai/internal/components.managedOpenCodeBuild=${managed_build} -X github.com/ivo-lopes/ivoai/internal/components.managedGraftBuild=${graft_build}" -o dist/ivoai ./cmd/ivoai
          go version -m dist/ivoai | grep -F 'vcs.modified=false'
          tar -C dist -czf "dist/release/ivoai_${GOOS}_${GOARCH}.tar.gz" ivoai
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ivoai-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/release/*

  skill:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package Web skill
        run: scripts/package-skill.sh ./ivoai-memory-context.zip
      - name: Validate skill archive
        run: unzip -t ivoai-memory-context.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ivoai-memory-context-skill
          path: ivoai-memory-context.zip

  publish:
    needs: [build, skill]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ivoai-*
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum ivoai_*.tar.gz ivoai-opencode_*.tar.gz managed-opencode-*.json ivoai-graft_*.tar.gz managed-graft-*.json ivoai-memory-context.zip > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="release-notes/${GITHUB_REF_NAME}.md"
          test -s "$notes_file"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists; refusing to replace immutable assets" >&2
            exit 1
          fi
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          # Upload into a draft first. A failed upload must never leave a
          # partially populated public release under an immutable tag.
          gh release create "${GITHUB_REF_NAME}" ivoai_*.tar.gz ivoai-opencode_*.tar.gz managed-opencode-*.json ivoai-graft_*.tar.gz managed-graft-*.json ivoai-memory-context.zip checksums.txt --verify-tag --draft --notes-file "$notes_file" "${release_flags[@]}"
          mapfile -t actual_assets < <(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | sort)
          mapfile -t expected_assets < <(printf '%s\n' checksums.txt ivoai-memory-context.zip ivoai_linux_amd64.tar.gz ivoai_linux_arm64.tar.gz ivoai-opencode_linux_amd64.tar.gz ivoai-opencode_linux_arm64.tar.gz managed-opencode-amd64.json managed-opencode-arm64.json ivoai-graft_linux_amd64.tar.gz ivoai-graft_linux_arm64.tar.gz managed-graft-amd64.json managed-graft-arm64.json | sort)
          if [[ "${actual_assets[*]}" != "${expected_assets[*]}" ]]; then
            echo "draft release asset set is incomplete; leaving draft unpublished" >&2
            printf 'expected: %s\nactual: %s\n' "${expected_assets[*]}" "${actual_assets[*]}" >&2
            exit 1
          fi
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
