name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Tests, race, and vet
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
      - name: ShellCheck
        run: shellcheck install.sh scripts/*.sh
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - name: Install idempotency smoke
        env:
          IVOAI_SMOKE_TARGET: release
        run: scripts/install-smoke.sh

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build archive
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION#v}" -o dist/ivoai ./cmd/ivoai
          tar -C dist -czf "ivoai_${GOOS}_${GOARCH}.tar.gz" ivoai
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ivoai-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ivoai_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz

  skill:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Package Web skill
        run: scripts/package-skill.sh ./ivoai-memory-context.zip
      - name: Validate skill archive
        run: unzip -t ivoai-memory-context.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ivoai-memory-context-skill
          path: ivoai-memory-context.zip

  publish:
    needs: [build, skill]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ivoai-*
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum ivoai_*.tar.gz ivoai-memory-context.zip > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" ivoai_*.tar.gz ivoai-memory-context.zip checksums.txt --verify-tag --generate-notes
