name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Docusaurus production build and embedded-site consistency
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          scripts/build-docs.sh --check
          scripts/audit-docs-dependencies.sh
      - name: Docusaurus accessibility and responsive audit
        run: |
          corepack pnpm --dir website exec playwright install --with-deps chromium
          corepack pnpm --dir website test:a11y
      - name: Generated CLI reference is current
        run: scripts/generate-cli-reference.sh --check
      - name: Tests, race, and vet
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
      - name: Managed OpenCode HTTP and attach integration
        run: scripts/test-managed-opencode.sh
      - name: ShellCheck
        run: shellcheck install.sh scripts/*.sh
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - name: Install idempotency smoke
        env:
          IVOAI_SMOKE_TARGET: release
        run: scripts/install-smoke.sh
      - name: v0.5.0 upgrade and rollback gate
        run: scripts/upgrade-matrix.sh

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build archive
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION#v}" -o dist/ivoai ./cmd/ivoai
          tar -C dist -czf "ivoai_${GOOS}_${GOARCH}.tar.gz" ivoai
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ivoai-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ivoai_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz

  skill:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package Web skill
        run: scripts/package-skill.sh ./ivoai-memory-context.zip
      - name: Validate skill archive
        run: unzip -t ivoai-memory-context.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ivoai-memory-context-skill
          path: ivoai-memory-context.zip

  publish:
    needs: [build, skill]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ivoai-*
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum ivoai_*.tar.gz ivoai-memory-context.zip > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="release-notes/${GITHUB_REF_NAME}.md"
          test -s "$notes_file"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists; refusing to replace immutable assets" >&2
            exit 1
          fi
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          # Upload into a draft first. A failed upload must never leave a
          # partially populated public release under an immutable tag.
          gh release create "${GITHUB_REF_NAME}" ivoai_*.tar.gz ivoai-memory-context.zip checksums.txt --verify-tag --draft --notes-file "$notes_file" "${release_flags[@]}"
          mapfile -t actual_assets < <(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | sort)
          mapfile -t expected_assets < <(printf '%s\n' checksums.txt ivoai-memory-context.zip ivoai_linux_amd64.tar.gz ivoai_linux_arm64.tar.gz | sort)
          if [[ "${actual_assets[*]}" != "${expected_assets[*]}" ]]; then
            echo "draft release asset set is incomplete; leaving draft unpublished" >&2
            printf 'expected: %s\nactual: %s\n' "${expected_assets[*]}" "${actual_assets[*]}" >&2
            exit 1
          fi
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
