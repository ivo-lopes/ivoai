name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"
      - name: Docusaurus production build and embedded-site consistency
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack prepare pnpm@12.11.2 --activate
          scripts/build-docs.sh --check
          scripts/audit-docs-dependencies.sh
      - name: Docusaurus accessibility and responsive audit
        run: |
          corepack pnpm --dir website exec playwright install --with-deps chromium
          corepack pnpm --dir website test:a11y
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high --prefix internal/components/assets
      - name: Patched braces regression fixtures
        run: bash scripts/test-braces.sh
      - name: Reviewed Graft build and ABI fixtures
        run: |
          python3 scripts/test-build-managed-graft.py
          python3 scripts/test-graft-abi.py
          python3 patches/graft/test_prepare_grammars.py
          python3 patches/graft/test_prune_cli.py
      - name: Generated CLI reference is current
        run: scripts/generate-cli-reference.sh --check
      - name: Managed TUI semantic goldens (read-only comparison)
        run: node --test internal/opencodebridge/presentation.test.mjs internal/opencodebridge/keyboard.test.mjs internal/opencodebridge/events.test.mjs
      - name: Unit tests
        shell: bash
        run: |
          set +e
          output="$(go test ./... 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if (( status != 0 )); then
            annotation="${output//'%'/'%25'}"
            annotation="${annotation//$'\r'/'%0D'}"
            annotation="${annotation//$'\n'/'%0A'}"
            printf '::error title=Unit test failure::%s\n' "$annotation"
          fi
          exit "$status"
      - name: Non-executing intake and documentation comparison fixtures
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/test-smoke-native-auto.py
      - name: Managed OpenCode HTTP and attach integration
        run: scripts/test-managed-opencode.sh
      - name: Native Codex TUI and fail-closed App Server admission
        run: scripts/test-native-codex.sh
      - name: Race tests
        run: go test -race -timeout 20m ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath ./cmd/ivoai
      - name: ShellCheck
        run: shellcheck install.sh scripts/*.sh
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - name: v0.5.0 upgrade and rollback matrix
        run: scripts/upgrade-matrix.sh

  managed-frontend:
    name: Patched managed frontend (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install non-AVX CPU smoke dependency
        if: matrix.arch == 'amd64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
      - name: Build pinned source patch without dependency hooks
        run: scripts/build-managed-opencode.sh "$PWD/dist/managed-frontend"
      - name: Native TUI success and failure feedback
        run: |
          scripts/test-opencode-baseline.sh \
            "$PWD/dist/managed-frontend/ivoai-opencode_linux_${{ matrix.arch }}.tar.gz" \
            "$PWD/dist/managed-frontend/managed-opencode-${{ matrix.arch }}.json"
          scripts/test-patched-opencode.sh \
            "$PWD/dist/managed-frontend/ivoai-opencode_linux_${{ matrix.arch }}.tar.gz" \
            "$PWD/dist/managed-frontend/managed-opencode-${{ matrix.arch }}.json"

  managed-graft:
    name: Reviewed Graft runtime (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install reviewed build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor binutils gcc-12 g++-12 make python3 patch
      - name: Install non-AVX CPU smoke dependency
        if: matrix.arch == 'amd64'
        run: sudo apt-get install -y --no-install-recommends qemu-user
      - name: Admit only the CI sandbox launcher to user namespaces
        run: scripts/setup-ci-graft-sandbox.sh
      - name: Build locked library and enforce ABI baseline
        env:
          GRAFT_GCC_MAJOR: "12"
        run: scripts/build-managed-graft.sh "$PWD/dist/managed-graft"
      - name: Exercise distributed library without AVX
        run: |
          scripts/test-graft-baseline.sh \
            "$PWD/dist/managed-graft/ivoai-graft_linux_${{ matrix.arch }}.tar.gz" \
            "$PWD/dist/managed-graft/managed-graft-${{ matrix.arch }}.json"
      - name: Native sandbox and structural contracts on distributed bytes
        run: |
          scripts/test-managed-graft.sh \
            "$PWD/dist/managed-graft/ivoai-graft_linux_${{ matrix.arch }}.tar.gz" \
            "$PWD/dist/managed-graft/managed-graft-${{ matrix.arch }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: managed-graft-${{ matrix.arch }}
          path: dist/managed-graft/*

  install-smoke:
    name: Install smoke (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04
            image: ubuntu:22.04
          - name: Ubuntu 24.04
            image: ubuntu:24.04
          - name: Debian 12
            image: debian:12-slim
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install smoke dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends bash ca-certificates coreutils curl git gzip tar
      - name: Source installer bootstraps missing Go
        if: matrix.name == 'Ubuntu 24.04'
        run: |
          mkdir -p /tmp/ivoai-bootstrap-home /tmp/ivoai-bootstrap-bin
          env HOME=/tmp/ivoai-bootstrap-home \
            XDG_STATE_HOME=/tmp/ivoai-bootstrap-home/state \
            IVOAI_INSTALL_DIR=/tmp/ivoai-bootstrap-bin \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            ./install.sh
          /tmp/ivoai-bootstrap-bin/ivoai version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Two-command and idempotency smoke
        env:
          IVOAI_SMOKE_TARGET: ${{ matrix.name }}
        run: scripts/install-smoke.sh

  real-client-install:
    name: Real client install (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04
            image: ubuntu:22.04
          - name: Ubuntu 24.04
            image: ubuntu:24.04
          - name: Debian 12
            image: debian:12-slim
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install platform prerequisites
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates coreutils curl git gzip tar xz-utils libatomic1
          useradd --create-home --shell /bin/sh ivoai-test
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install binary from checkout
        run: ./install.sh
      - name: Run real two-command experience twice
        run: |
          su - ivoai-test -c 'ivoai setup'
          su - ivoai-test -c 'ivoai setup'
          su - ivoai-test -c 'ivoai status'
          su - ivoai-test -c 'ivoai doctor'
          su - ivoai-test -c 'ivoai doctor --json' | grep -Eq '"overall"[[:space:]]*:[[:space:]]*"READY"'

  real-server-deployment:
    name: Real Ubuntu 24.04 server deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install server binary
        run: sudo env "PATH=$PATH" ./install.sh
      - name: Deploy server twice
        run: |
          sudo ivoai setup --mode server
          sudo ivoai setup --mode server
      - name: Verify server diagnostics and access administration
        run: |
          sudo ivoai server doctor | tee /tmp/ivoai-server-doctor.txt
          grep -q 'Docs: status=healthy listen=0.0.0.0:7780 local_url=http://127.0.0.1:7780/' /tmp/ivoai-server-doctor.txt
          sudo ivoai server enrollment create --ttl 5m | grep -F 'shown once' >/dev/null
          sudo ivoai server gateway configure --public-url https://ivoai-ci.example
          sudo ivoai server web-access create --ttl 5m | grep -F 'shown once' >/dev/null
      - name: Verify production docs service and network bind
        run: |
          systemctl is-enabled --quiet ivoai-docs.service || {
            echo 'DOCS_BOOT_ENABLEMENT=FAIL'
            systemctl is-enabled ivoai-docs.service || true
            exit 1
          }
          echo 'DOCS_BOOT_ENABLEMENT=PASS'
          systemctl is-active --quiet ivoai-docs.service || {
            echo 'DOCS_SERVICE_ACTIVE=FAIL'
            systemctl status --no-pager ivoai-docs.service || true
            exit 1
          }
          echo 'DOCS_SERVICE_ACTIVE=PASS'
          ss -lnt4 > /tmp/ivoai-listeners.txt
          grep -Eq '(0\.0\.0\.0|\*):7780([[:space:]]|$)' /tmp/ivoai-listeners.txt || {
            echo 'DOCS_BIND_0_0_0_0=FAIL'
            cat /tmp/ivoai-listeners.txt
            exit 1
          }
          echo 'DOCS_BIND_0_0_0_0=PASS'
          curl --noproxy '*' --retry 10 --retry-connrefused --retry-delay 1 -fsS \
            --output /tmp/ivoai-docs-index.html http://127.0.0.1:7780/
          grep -q 'IVOAI' /tmp/ivoai-docs-index.html || {
            echo 'DOCS_LOOPBACK_HTTP=FAIL'
            exit 1
          }
          echo 'DOCS_LOOPBACK_HTTP=PASS'
          docs_lan_ip="$(hostname -I | awk '{print $1}')"
          test -n "$docs_lan_ip"
          curl --noproxy '*' --retry 10 --retry-connrefused --retry-delay 1 -fsS \
            --output /tmp/ivoai-docs-health.txt "http://${docs_lan_ip}:7780/healthz"
          grep -q 'healthy' /tmp/ivoai-docs-health.txt || {
            echo 'DOCS_LAN_HTTP=FAIL'
            exit 1
          }
          echo 'DOCS_LAN_HTTP=PASS'
          systemctl show ivoai-docs.service --property=ExecStart --value > /tmp/ivoai-docs-exec-start.txt
          grep -q 'ivoai server docs serve' /tmp/ivoai-docs-exec-start.txt || {
            echo 'DOCS_PRODUCTION_EXEC=FAIL'
            cat /tmp/ivoai-docs-exec-start.txt
            exit 1
          }
          echo 'DOCS_PRODUCTION_EXEC=PASS'
      - name: Verify remote MCP OAuth registration
        run: |
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS -H 'Content-Type: application/json' \
            --data-binary '{"client_name":"CI","redirect_uris":["https://example.test/callback"],"token_endpoint_auth_method":"none"}' \
            --output /tmp/ivoai-oauth-registration.json http://127.0.0.1:7744/oauth/register
          grep -q '"client_id"' /tmp/ivoai-oauth-registration.json
      - name: Verify backup and restore
        run: |
          sudo ivoai server backup --output /var/lib/ivoai/backups/ci-backup.tar.gz
          sudo ivoai server restore --input /var/lib/ivoai/backups/ci-backup.tar.gz
          sudo ivoai server doctor

  debian12-lxc-bootstrap:
    name: Debian 12/LXC bootstrap contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Provision clean Debian 12 LXC contract twice
        run: scripts/debian12-server-bootstrap-smoke.sh

  cross-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o "ivoai_${GOOS}_${GOARCH}" ./cmd/ivoai
