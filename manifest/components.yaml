    images:
      linux/amd64:
        reference: "ghcr.io/huggingface/text-embeddings-inference@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d"
        upstream_tag: "cpu-1.9.4"
      linux/arm64:
        reference: "ghcr.io/huggingface/text-embeddings-inference@sha256:798cd7615e060a72ccbdf19aa0ada52289c6a0147490195bafaece6ce04d70f1"
        upstream_tag: "cpu-arm64-1.9.4"
