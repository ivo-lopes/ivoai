schema_version: 1
validated_at: "2026-11-04"
transitive_dependency_cutoff: "2026-11-06T14:41:25Z"
policy:
  allow_latest_tags: false
  update_command: "ivoai update"
  supported_client_platforms:
    - linux/amd64
    - linux/arm64
  supported_server_platforms:
    - linux/amd64
    - linux/arm64

components:
  - name: mcp-go-sdk
    role: [server]
    validated_version: "1.8.0"
    minimum_version: "1.8.0"
    license: "Apache-2.0 / MIT (file-specific)"
    source: "https://github.com/modelcontextprotocol/go-sdk/releases/tag/v1.8.0"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: statically_linked_go_module
    checksum_strategy: go_sum
    notes:
      - "Provides the official stateless Streamable HTTP transport and protocol implementation for the public Web MCP endpoint."

  - name: ivoai
    role: [client, server]
    validated_version: "0.12.0"
    minimum_version: "0.1.0"
    license: MIT
    source: "https://github.com/ivo-lopes/ivoai"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: github_release_asset
    checksum_strategy: release_sha256sums

  - name: go-toolchain
    role: [development-bootstrap]
    validated_version: "1.27.3"
    minimum_version: "1.27.3"
    license: BSD-3-Clause
    source: "https://go.dev/dl/"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: ephemeral_source_build_toolchain
    checksum_strategy: official_archive_sha256
    assets:
      linux/amd64:
        url: "https://go.dev/dl/go1.27.3.linux-amd64.tar.gz"
        sha256: "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40"
      linux/arm64:
        url: "https://go.dev/dl/go1.27.3.linux-arm64.tar.gz"
        sha256: "a06e99309dbcbdca1a8ccd2282c3ee146e55930886e26b4f1193269587165f49"
    notes:
      - "Used only when installing from a source checkout without a compatible system Go; extracted under the installer temporary directory and removed after the build."

  - name: codex
    role: [client]
    package: "@openai/codex"
    validated_version: "0.167.0"
    minimum_version: "0.148.0"
    license: Apache-2.0
    source: "https://github.com/openai/codex/releases/tag/rust-v0.167.0"
    documentation: "https://learn.chatgpt.com/docs/codex/cli"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: github_release_asset
    checksum_strategy: reviewed_release_asset_sha256
    assets:
      linux/amd64:
        url: "https://github.com/openai/codex/releases/download/rust-v0.167.0/codex-x86_64-unknown-linux-musl.tar.gz"
        sha256: "9d64836106d5b374e90ee4454c7ebcde7ca7106558bd7e41a34b9f26ebda251a"
      linux/arm64:
        url: "https://github.com/openai/codex/releases/download/rust-v0.167.0/codex-aarch64-unknown-linux-musl.tar.gz"
        sha256: "843489acb4d4b1079745c36b03c5963b887b83155af208fd53584e33ee8eb281"
    auth:
      default: "codex login"
      status: "codex login status"
      subscription_supported: true
      payg_key_required: false

  - name: claude-code
    role: [client]
    package: "@anthropic-ai/claude-code"
    validated_version: "2.1.318"
    observed_latest_version: "2.1.318"
    minimum_version: "2.1.318"
    license: Proprietary-Anthropic-Terms
    source: "https://github.com/anthropics/claude-code/releases/tag/v2.1.318"
    documentation: "https://code.claude.com/docs/en/getting-started"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: github_release_asset
    checksum_strategy: reviewed_release_asset_sha256
    signing_key_fingerprint: "31DD DE24 DDFA B679 F42D 7BD2 BAA9 29FF 1A7E CACE"
    assets:
      linux/amd64:
        url: "https://github.com/anthropics/claude-code/releases/download/v2.1.318/claude-linux-x64.tar.gz"
        sha256: "e6d426ca0c123f61fad58a361da0329f2a93cd206bc87040ed8d9576dd9eb583"
      linux/arm64:
        url: "https://github.com/anthropics/claude-code/releases/download/v2.1.318/claude-linux-arm64.tar.gz"
        sha256: "0f4fb66a2af3bf02d114099727e4a7745f117b1e63d2f77c8aff165590197421"
    auth:
      default: "claude auth login"
      subscription_supported: true
      payg_key_required: false
    notes:
      - "Pinned to the reviewed official v2.1.318 release."
      - "ivoai must disable Claude's silent auto-update for a managed install and update only through ivoai update."

  - name: codex-code-mode-host
    role: [client]
    package: "@openai/codex companion"
    validated_version: "0.167.0"
    minimum_version: "0.148.0"
    license: Apache-2.0
    source: "https://github.com/openai/codex/releases/tag/rust-v0.167.0"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: github_release_asset_when_codex_is_managed
    checksum_strategy: github_release_asset_digest_sha256
    assets:
      linux/amd64:
        url: "https://github.com/openai/codex/releases/download/rust-v0.167.0/codex-code-mode-host-x86_64-unknown-linux-musl.tar.gz"
        sha256: "b5074d5dd64643b2c073927e494a588eff31c1f5a27f12c1e2c45f9a6cf07dd4"
      linux/arm64:
        url: "https://github.com/openai/codex/releases/download/rust-v0.167.0/codex-code-mode-host-aarch64-unknown-linux-musl.tar.gz"
        sha256: "6e99948fa20ca816a01f222a56afa261b321e00cbed611d76bb92c765fd11ec6"
    notes:
      - "Installed beside managed Codex because the stable Code Mode tool router fails closed when the companion is absent."
      - "The companion has no --version endpoint; compatibility is pinned to the exact Codex release and verified by the reviewed archive digest."

  - name: headroom
    role: [client]
    package: "headroom-ai[proxy]"
    validated_version: "0.43.1"
    minimum_version: "0.43.1"
    license: Apache-2.0
    source: "https://github.com/headroomlabs-ai/headroom/releases/tag/v0.43.1"
    documentation: "https://headroomlabs-ai.github.io/headroom/cli/"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: isolated_python_tool
    runtime_requirement: "Python >=3.10"
    checksum_strategy: pypi_sha256
    assets:
      linux/amd64:
        filename: "headroom_ai-0.43.1-cp310-abi3-manylinux_2_28_x86_64.whl"
        url: "https://github.com/headroomlabs-ai/headroom/releases/download/v0.43.1/headroom_ai-0.43.1-cp310-abi3-manylinux_2_28_x86_64.whl"
        sha256: "2e9cd1a9aab42f60b00a9f7c8a85cf82815b51b1989179e5fdd40ddd09915d6e"
      linux/arm64:
        filename: "headroom_ai-0.43.1-cp310-abi3-manylinux_2_28_aarch64.whl"
        url: "https://github.com/headroomlabs-ai/headroom/releases/download/v0.43.1/headroom_ai-0.43.1-cp310-abi3-manylinux_2_28_aarch64.whl"
        sha256: "12bf1314ff0b3d6f0860b41578422b77949203a93c14bec9f692c7e5b36a862f"
    notes:
      - "The installed CLI is optional. Managed wrapping remains unavailable_by_policy until configuration isolation and exact recovery are certified; Direct fallback remains mandatory."
      - "Architecture-specific transitive constraints and hashes are embedded; uv installs wheels against exact CPython 3.14.10."

  - name: caveman
    role: [client]
    validated_version: "4.0.2-ivoai.1"
    minimum_version: "4.0.2-ivoai.1"
    upstream_binary_version: "bin-v4.0.2"
    upstream_revision: "b4531dfc05a3ef0ba93b57e8bfa5f48564a4b4d6"
    source_sha256: "29ef4c5bccee70dbc486bae266f966b8bd53132c6e12e27e9b06b36cf35c51f4"
    patch_sha256: "5f95e80d41d5744f16e09d534b1d56585fe746f9d5aed1e14c2586bbe953810d"
    license: Apache-2.0
    source: "https://github.com/JuliusBrussee/caveman/tree/b4531dfc05a3ef0ba93b57e8bfa5f48564a4b4d6"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: immutable_supply_chain
    payload_format: tar_gzip
    payload_path: caveman-proxy
    release_archive: "ivoai-caveman_linux_{arch}.tar.gz"
    build_script: "scripts/build-managed-caveman.sh"
    metadata: "ivoai-caveman_linux_{arch}.metadata.json"
    signature_status: not_exposed
    attestation_status: not_exposed
    trust_level: checksum_only
    notes:
      - "IVOAI rebuild of Apache-2.0 source with x/net0.62.0 and compress1.20.2 security updates. Not an upstream binary or upstream signature."
      - "Compiled release metadata binds the exact source, patch and artifact. Development builds without metadata do not install an upstream fallback."
      - "Proxy retains CGO tree-sitter grammars with static musl and baseline amd64/no-AVX or ARMv8-a. Caveman remains default; Headroom optional; Direct fallback."
      - "Do not run upstream installers, modify personal hooks or chain compression proxies."
  - name: caveman-mcp
    role: [client]
    validated_version: "4.0.2-ivoai.1"
    minimum_version: "4.0.2-ivoai.1"
    license: Apache-2.0
    source: "https://github.com/JuliusBrussee/caveman/tree/b4531dfc05a3ef0ba93b57e8bfa5f48564a4b4d6"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: immutable_supply_chain
    requires_managed: caveman
    payload_format: tar_gzip
    payload_path: caveman-mcp
    release_archive: "ivoai-caveman_linux_{arch}.tar.gz"
    metadata: "ivoai-caveman_linux_{arch}.metadata.json"
    signature_status: not_exposed
    attestation_status: not_exposed
    trust_level: checksum_only
    notes:
      - "Same reviewed archive and identity as the proxy. Pure-Go MCP matches upstream build policy."
      - "Internal bounded ephemeral stdio caveman_compress only; never registered as a primary tool or durable memory."
  - name: opencode
    role: [client]
    validated_version: "1.19.0"
    minimum_version: "1.19.0"
    revision: "733b2c627e5aec39cb33cc22373bdce33053ef2c"
    default_branch: dev
    license: MIT
    source: "https://github.com/anomalyco/opencode/releases/tag/v1.19.0"
    documentation: "https://opencode.ai/docs/"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: managed_supply_chain_release_archive
    checksum_strategy: github_release_asset_digest_sha256
    assets:
      linux/amd64:
        url: "https://github.com/anomalyco/opencode/releases/download/v1.19.0/opencode-linux-x64.tar.gz"
        sha256: "7bb9e61ad6feacf2e89c10a6a2c1840e3de4220bb50ba1fc7110f31806076aec"
      linux/arm64:
        url: "https://github.com/anomalyco/opencode/releases/download/v1.19.0/opencode-linux-arm64.tar.gz"
        sha256: "e9841d43d3e1a8f36ed2691592d3b8b4fb097e606c8b559a277a1b845840e26b"
    auth:
      default: "opencode auth login"
      subscription_or_provider_owned: true
      payg_key_required_by_ivoai: false
    notes:
      - "Source pin below is upstream; official IVOAI releases override it with reviewed private 1.19.0-ivoai.3 archive metadata."
      - "Managed launch requires 1.19.0-ivoai.3 local-plugin/no-runtime-npm policy; .2/upstream/unknown builds require an explicit update before launch."
      - "Authentication remains entirely owned by OpenCode; IVOAI never reads or persists its auth store."
      - "Direct primary sessions are supported; AUTO/worker use is deferred to IVOAI-22."

  - name: ai-memory
    role: [client, server]
    validated_version: "3.4.2"
    minimum_version: "3.4.2"
    license: MIT
    source: "https://github.com/akitaonrails/ai-memory/releases/tag/v3.4.2"
    changelog: "https://github.com/akitaonrails/ai-memory/blob/v3.4.2/CHANGELOG.md"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: github_release_asset
    checksum_strategy: adjacent_upstream_sha256
    assets:
      linux/amd64:
        url: "https://github.com/akitaonrails/ai-memory/releases/download/v3.4.2/ai-memory-linux-x86_64.tar.gz"
        sha256: "15a4f4a346a27e6fd63a36d1b3de23c5cbe142b80b3bce561e21b1f225a1e645"
      linux/arm64:
        url: "https://github.com/akitaonrails/ai-memory/releases/download/v3.4.2/ai-memory-linux-aarch64.tar.gz"
        sha256: "164f7c38bb9bafca218dd958c3c60febcd5d2f5200ad138c6f128576cedebfb6"
    server_image:
      reference: "akitaonrails/ai-memory@sha256:cf09de9f40d8d4f5214698826530e61e9061ad5e02001defc8a77d42ab4e50b7"
      tag_for_humans: "3.4.2"
    notes:
      - "Client and server are pinned to the reviewed 3.4.2 release; existing stores require explicit stopped-service backup, isolated-copy validation and coordinated runtime/data rollback; ordinary setup never migrates them."
      - "Hooks must spool/best-effort and always allow the primary agent to continue when the server is offline."

  - name: graft
    role: [client-runtime]
    validated_version: "0.21.1-ivoai.2"
    upstream_version: "0.21.1"
    minimum_version: "0.21.1-ivoai.2"
    license: MIT
    source: "https://github.com/trailhq/Graft"
    upstream_revision: "fe30ead39d5e6f0c921018d364da2bdbc9d4b3ad"
    source_archive: "https://codeload.github.com/trailhq/Graft/tar.gz/fe30ead39d5e6f0c921018d364da2bdbc9d4b3ad"
    source_sha256: "ab27f9123eeb59b3987a342a24b7e357ad3412f41c556fde3a76ca9e250d2db1"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: managed_supply_chain_archive
    runtime_requirement: "Private Node.js 26.13.0"
    checksum_strategy: compiled_release_archive_sha256
    trust_level: checksum_only
    signature_status: not_exposed
    attestation_status: not_exposed
    transitive_license_inventory: "patches/graft/grammar-licenses/inventory.json"
    managed_archive_pattern: "ivoai-graft_linux_<arch>.tar.gz"
    managed_payload_path: graft-runtime
    health_probe: "graft-runtime --version"
    notes:
      - "Only IVOAI-published release artifacts with compiled version/platform/source/patch/archive identity are installable; development builds without metadata omit Graft and diagnose its absence."
      - "The managed object contains the version-only sentinel, dist, reviewed node_modules, LICENSE and provenance inventories. No upstream CLI or npm lifecycle command runs during installation."
      - "The existing supply-chain limits, integrity checks, promotion and rollback apply; no upstream signature verification is claimed."

  - name: ruflo
    role: [client]
    package: ruflo
    validated_version: "3.72.2"
    minimum_version: "3.72.2"
    license: MIT
    source: "https://www.npmjs.com/package/ruflo/v/3.72.2"
    upstream_repository: "https://github.com/ruvnet/ruflo"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: isolated_npm_prefix
    runtime_requirement: "Node.js >=20"
    checksum_strategy: npm_registry_integrity
    integrity: "sha512-DHk7+8a2t5n7B+9PsTKTIGNz0LF8wToGwBOwhSuu0UFL9AabA3a+BHa4eZlY8225dMfZnfHzO+4m6El/R+EkXQ=="
    package_url: "https://registry.npmjs.org/ruflo/-/ruflo-3.72.2.tgz"
    safe_default_features:
      - coordination
      - hierarchical_swarm_lifecycle
      - opaque_task_lifecycle
      - workflows_without_direct_provider_calls
      - hooks
      - ephemeral_operational_state
    disabled_default_features:
      - agent_execute
      - direct_provider_inference
      - durable_memory
    notes:
      - "A reviewed npm v3 lock pins Ruflo and every transitive version, URL and integrity value."
      - "Production uses npm ci with lifecycle scripts disabled and a minimal credential-free environment."
      - "Open upstream issues #2356 and #2962 show agent_execute still requires a separately configured provider."
      - "No OPENAI_API_KEY or ANTHROPIC_API_KEY is requested by ivoai's default Ruflo profile."
      - "Session workers are official Codex/Claude CLI subprocesses; Ruflo receives only opaque lifecycle IDs and never delegation prompts or results."

  - name: nodejs
    role: [client-runtime]
    validated_version: "26.13.0"
    minimum_version: "26.13.0"
    license: MIT
    source: "https://nodejs.org/download/release/v26.13.0/"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: verified_isolated_archive
    checksum_strategy: upstream_sha256
    assets:
      linux/amd64:
        url: "https://nodejs.org/dist/v26.13.0/node-v26.13.0-linux-x64.tar.gz"
        sha256: "5848553868b402d3fabb5b09270649977780a390f832155721025a08b5104455"
      linux/arm64:
        url: "https://nodejs.org/dist/v26.13.0/node-v26.13.0-linux-arm64.tar.gz"
        sha256: "439e9c438acdf6a6ffe47418da709153d66c4bed812e30a473faacb107dd2791"
    notes:
      - "Private runtime for the pinned Ruflo and managed Graft installations; it does not modify the user's global Node.js setup."
      - "Official Node 26 Linux binaries require the system libatomic runtime (libatomic1 on Debian/Ubuntu), glibc >=2.28 and libstdc++ >=6.0.25."

  - name: uv
    role: [client-runtime]
    validated_version: "0.13.7"
    minimum_version: "0.13.7"
    license: Apache-2.0-or-MIT
    source: "https://github.com/astral-sh/uv/releases/tag/0.13.7"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: verified_isolated_archive
    checksum_strategy: upstream_sha256
    assets:
      linux/amd64:
        url: "https://github.com/astral-sh/uv/releases/download/0.13.7/uv-x86_64-unknown-linux-gnu.tar.gz"
        sha256: "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83"
      linux/arm64:
        url: "https://github.com/astral-sh/uv/releases/download/0.13.7/uv-aarch64-unknown-linux-gnu.tar.gz"
        sha256: "71279f8d3c67241e807b9d8db872d1bf541579fb9f08b7d1eb1682196d1e57dc"
    notes:
      - "Private runtime for Headroom; it does not modify the user's global Python tooling."
      - "Headroom's architecture-specific hashed constraints are generated with this pinned uv and the manifest cutoff."

  - name: python-runtime
    role: [client-runtime]
    project: CPython
    validated_version: "3.14.10"
    minimum_version: "3.14.10"
    license: PSF-2.0
    source: "https://www.python.org/downloads/release/python-31410/"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: uv_managed_python
    checksum_strategy: uv_managed_runtime_metadata
    notes:
      - "ivoai requests exactly 3.14.10 through the pinned uv runtime and keeps it below the ivoai data root."
      - "Latest stable CPython3.15.2 was evaluated but binary-only resolution failed for PyYAML and orjson;3.14.10 is the latest compatible runtime certified for the optional Headroom graph."
      - "The platform-specific managed Python artifact is selected and verified by pinned uv and is not bundled in ivoai release archives."

  - name: qdrant
    role: [server]
    validated_version: "1.20.0"
    minimum_version: "1.20.0"
    license: Apache-2.0
    source: "https://github.com/qdrant/qdrant/releases/tag/v1.20.0"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: docker_compose_internal_network
    checksum_strategy: oci_digest
    image:
      reference: "qdrant/qdrant@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2"
      tag_for_humans: "v1.20.0"
    exposure: internal_only

  - name: docker-engine
    role: [server-runtime]
    project: Docker Engine
    validated_version: "29.9.3"
    minimum_version: "28.0.0"
    license: Apache-2.0
    source: "https://docs.docker.com/engine/release-notes/29/"
    documentation: "https://docs.docker.com/engine/release-notes/28/"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: operator_managed_official_repository
    checksum_strategy: operating_system_package_manager
    notes:
      - "Engine 28 introduced gateway priority, which keeps model-download egress deterministic while backend publication networks remain non-masqueraded."
      - "Setup validates the daemon version but does not replace an existing Engine installation that may own unrelated containers."

  - name: docker-compose
    role: [server-runtime]
    project: Docker Compose
    validated_version: "5.7.0"
    minimum_version: "2.33.1"
    license: Apache-2.0
    source: "https://github.com/docker/compose/releases/tag/v5.7.0"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: verified_system_cli_plugin_fallback
    checksum_strategy: upstream_sha256
    assets:
      linux/amd64:
