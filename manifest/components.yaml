schema_version: 1
validated_at: "2026-08-25"
transitive_dependency_cutoff: "2026-08-21T00:00:00Z"
policy:
  allow_latest_tags: false
  update_command: "ivoai update"
  supported_client_platforms:
    - linux/amd64
    - linux/arm64
  supported_server_platforms:
    - linux/amd64
    - linux/arm64

components:
  - name: mcp-go-sdk
    role: [server]
    validated_version: "1.7.0"
    minimum_version: "1.7.0"
    license: "Apache-2.0 / MIT (file-specific)"
    source: "https://github.com/modelcontextprotocol/go-sdk/releases/tag/v1.7.0"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: statically_linked_go_module
    checksum_strategy: go_sum
    notes:
      - "Provides the official stateless Streamable HTTP transport and protocol implementation for the public Web MCP endpoint."

  - name: ivoai
    role: [client, server]
    validated_version: "0.5.0"
    minimum_version: "0.1.0"
    license: MIT
    source: "https://github.com/ivo-lopes/ivoai"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: github_release_asset
    checksum_strategy: release_sha256sums

  - name: go-toolchain
    role: [development-bootstrap]
    validated_version: "1.27.0"
    minimum_version: "1.27.0"
    license: BSD-3-Clause
    source: "https://go.dev/dl/"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: ephemeral_source_build_toolchain
    checksum_strategy: official_archive_sha256
    assets:
      linux/amd64:
        url: "https://go.dev/dl/go1.27.0.linux-amd64.tar.gz"
        sha256: "675c26c449cbb18fc24b74650de1eabbae6e16f64326fd85a283fb3b58280685"
      linux/arm64:
        url: "https://go.dev/dl/go1.27.0.linux-arm64.tar.gz"
        sha256: "51798d2c42d0e1c6ed7fd9f48728b4193abac9e8aad6dbac2fe96a81f5909bda"
    notes:
      - "Used only when installing from a source checkout without a compatible system Go; extracted under the installer temporary directory and removed after the build."

  - name: codex
    role: [client]
    package: "@openai/codex"
    validated_version: "0.148.0"
    minimum_version: "0.148.0"
    license: Apache-2.0
    source: "https://github.com/openai/codex/releases/tag/rust-v0.148.0"
    documentation: "https://learn.chatgpt.com/docs/codex/cli"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: github_release_asset
    checksum_strategy: reviewed_release_asset_sha256
    assets:
      linux/amd64:
        url: "https://github.com/openai/codex/releases/download/rust-v0.148.0/codex-x86_64-unknown-linux-musl.tar.gz"
        sha256: "1a36f762f6b3bef533bb86345ad9517661c2d84d53996a250cf2ca89d2cfee5a"
      linux/arm64:
        url: "https://github.com/openai/codex/releases/download/rust-v0.148.0/codex-aarch64-unknown-linux-musl.tar.gz"
        sha256: "410c6ae0c763eb39c6da17665e63f9aa4a98e6ee663d81f8e8b779c97cb175ac"
    auth:
      default: "codex login"
      status: "codex login status"
      subscription_supported: true
      payg_key_required: false

  - name: claude-code
    role: [client]
    package: "@anthropic-ai/claude-code"
    validated_version: "2.1.228"
    observed_latest_version: "2.1.237"
    minimum_version: "2.1.228"
    license: Proprietary-Anthropic-Terms
    source: "https://github.com/anthropics/claude-code/releases/tag/v2.1.228"
    documentation: "https://code.claude.com/docs/en/getting-started"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: github_release_asset
    checksum_strategy: reviewed_release_asset_sha256
    signing_key_fingerprint: "31DD DE24 DDFA B679 F42D 7BD2 BAA9 29FF 1A7E CACE"
    assets:
      linux/amd64:
        url: "https://github.com/anthropics/claude-code/releases/download/v2.1.228/claude-linux-x64.tar.gz"
        sha256: "9050d667bcc3940b7ceee65e3e5c4439d2b7161a71d940fdf60192302243f960"
      linux/arm64:
        url: "https://github.com/anthropics/claude-code/releases/download/v2.1.228/claude-linux-arm64.tar.gz"
        sha256: "877d423c35e6d059752f86399352837df5bf1af2a9dbcda5753d898629a439f4"
    auth:
      default: "claude auth login"
      subscription_supported: true
      payg_key_required: false
    notes:
      - "Pinned to Anthropic's stable channel; 2.1.237 was the latest channel on the validation date."
      - "ivoai must disable Claude's silent auto-update for a managed install and update only through ivoai update."

  - name: codex-code-mode-host
    role: [client]
    package: "@openai/codex companion"
    validated_version: "0.148.0"
    minimum_version: "0.148.0"
    license: Apache-2.0
    source: "https://github.com/openai/codex/releases/tag/rust-v0.148.0"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: github_release_asset_when_codex_is_managed
    checksum_strategy: github_release_asset_digest_sha256
    assets:
      linux/amd64:
        url: "https://github.com/openai/codex/releases/download/rust-v0.148.0/codex-code-mode-host-x86_64-unknown-linux-musl.tar.gz"
        sha256: "8e6e559b228fa61b18fb2c28c31ec02068751025bcce3f00cf63c79499d59829"
      linux/arm64:
        url: "https://github.com/openai/codex/releases/download/rust-v0.148.0/codex-code-mode-host-aarch64-unknown-linux-musl.tar.gz"
        sha256: "1c410fe4bb174949649efe05c150b1512fb4775d5874eb54b2edb624cf7513a4"
    notes:
      - "Installed beside managed Codex because the stable Code Mode tool router fails closed when the companion is absent."
      - "The companion has no --version endpoint; compatibility is pinned to the exact Codex release and verified by the reviewed archive digest."

  - name: headroom
    role: [client]
    package: "headroom-ai[proxy]"
    validated_version: "0.36.0"
    minimum_version: "0.36.0"
    license: Apache-2.0
    source: "https://github.com/headroomlabs-ai/headroom/releases/tag/v0.36.0"
    documentation: "https://headroomlabs-ai.github.io/headroom/cli/"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: isolated_python_tool
    runtime_requirement: "Python >=3.10"
    checksum_strategy: pypi_sha256
    assets:
      linux/amd64:
        filename: "headroom_ai-0.36.0-cp310-abi3-manylinux_2_28_x86_64.whl"
        url: "https://github.com/headroomlabs-ai/headroom/releases/download/v0.36.0/headroom_ai-0.36.0-cp310-abi3-manylinux_2_28_x86_64.whl"
        sha256: "fab6af014363c5a9a6bb41913a84df6f1daaecb56edf005925940e4501937f42"
      linux/arm64:
        filename: "headroom_ai-0.36.0-cp310-abi3-manylinux_2_28_aarch64.whl"
        url: "https://github.com/headroomlabs-ai/headroom/releases/download/v0.36.0/headroom_ai-0.36.0-cp310-abi3-manylinux_2_28_aarch64.whl"
        sha256: "a00f3d7a705e15bc52a529c1476a775badb8d0e2e3fb72ec96f952814121697c"
    notes:
      - "Use headroom wrap codex/claude only after a local compatibility probe; direct-agent fallback is mandatory."
      - "Architecture-specific transitive constraints and hashes are embedded; uv installs wheels against exact CPython 3.13.15."

  - name: caveman
    role: [client]
    validated_version: "1.1.3"
    product_release: "v2.3.1"
    product_revision: "b5ec6351396b643a17cbbec4a6eee8b3fb9dd782"
    runtime_revision: "0d2f052babfd613ec9b4186c86ec6f133cdfd4d7"
    minimum_version: "1.1.3"
    license: BSL-1.1
    source: "https://github.com/JuliusBrussee/caveman/releases/tag/bin-v1.1.3"
    documentation: "https://github.com/JuliusBrussee/caveman/blob/v2.3.1/README.md"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: managed_supply_chain_raw_binary
    checksum_strategy: upstream_checksums_asset_sha256
    assets:
      linux/amd64:
        url: "https://github.com/JuliusBrussee/caveman/releases/download/bin-v1.1.3/caveman-proxy_linux_amd64"
        sha256: "d883b9ab4b559e0c1935335c0e24400deb5c61d5e247f1ca239c4149f57885b0"
      linux/arm64:
        url: "https://github.com/JuliusBrussee/caveman/releases/download/bin-v1.1.3/caveman-proxy_linux_arm64"
        sha256: "2d6c1950bbce1a70c910a03bde88883817a8380f03f5ec25dd80186fed434ce7"
    notes:
      - "Only the BSL-1.1 proxy/runtime is managed; the MIT CLI and skills are not installed by IVOAI in this phase."
      - "The upstream checksums.txt.keysig is recorded as published but is not claimed as independently verified."
      - "The BSL Additional Use Grant observed at v2.3.1 permits internal, CI and first-party self-hosted use; third-party managed service use requires commercial licensing."
      - "No Caveman memory, MCP, browse, learn, pixel, hooks, statusline or global setup is enabled."

  - name: caveman-mcp
    role: [client]
    validated_version: "1.1.3"
    runtime_revision: "0d2f052babfd613ec9b4186c86ec6f133cdfd4d7"
    minimum_version: "1.1.3"
    license: BSL-1.1
    source: "https://github.com/JuliusBrussee/caveman/releases/tag/bin-v1.1.3"
    documentation: "https://github.com/JuliusBrussee/caveman/blob/v2.3.1/README.md"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: managed_supply_chain_raw_binary
    checksum_strategy: upstream_checksums_asset_sha256
    requires_managed: caveman
    assets:
      linux/amd64:
        url: "https://github.com/JuliusBrussee/caveman/releases/download/bin-v1.1.3/caveman-mcp_linux_amd64"
        sha256: "c5c9a850f388570e2b822ac86ac35ad0e9f2c8ec0162b966f5536013042c058d"
      linux/arm64:
        url: "https://github.com/JuliusBrussee/caveman/releases/download/bin-v1.1.3/caveman-mcp_linux_arm64"
        sha256: "433b16942095ef0a615ba474c398c3a4f46c589dc447d4505025953c934f13e0"
    notes:
      - "Local-only stdio helper used internally by WorkingContext; it is never registered automatically with the primary."
      - "No npx, global install, durable memory, browse, learn, pixel or external service is used."

  - name: opencode
    role: [client]
    validated_version: "1.18.25"
    minimum_version: "1.18.25"
    revision: "cb7d8b2f5e44876ef98b661dc10590c915af3a9f"
    default_branch: dev
    license: MIT
    source: "https://github.com/anomalyco/opencode/releases/tag/v1.18.25"
    documentation: "https://opencode.ai/docs/"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: managed_supply_chain_release_archive
    checksum_strategy: github_release_asset_digest_sha256
    assets:
      linux/amd64:
        url: "https://github.com/anomalyco/opencode/releases/download/v1.18.25/opencode-linux-x64.tar.gz"
        sha256: "58a3729a6f3432dd6d2917fcc4a949788891a035818646ad480e12c947f56e78"
      linux/arm64:
        url: "https://github.com/anomalyco/opencode/releases/download/v1.18.25/opencode-linux-arm64.tar.gz"
        sha256: "35ef77897425e41b5183a2c21ac4fb1d4d944d82a94e3c920f57b5490af11ac5"
    auth:
      default: "opencode auth login"
      subscription_or_provider_owned: true
      payg_key_required_by_ivoai: false
    notes:
      - "Authentication remains entirely owned by OpenCode; IVOAI never reads or persists its auth store."
      - "Direct primary sessions are supported; AUTO/worker use is deferred to IVOAI-22."

  - name: ai-memory
    role: [client, server]
    validated_version: "1.29.0"
    minimum_version: "1.29.0"
    license: MIT
    source: "https://github.com/akitaonrails/ai-memory/releases/tag/v1.29.0"
    changelog: "https://github.com/akitaonrails/ai-memory/blob/v1.29.0/CHANGELOG.md"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: github_release_asset
    checksum_strategy: adjacent_upstream_sha256
    assets:
      linux/amd64:
        url: "https://github.com/akitaonrails/ai-memory/releases/download/v1.29.0/ai-memory-linux-x86_64.tar.gz"
        sha256: "c666fa4ec778673ae995cd8aa4489b6184c7a3dc220a2c4e1c18792eda1321f1"
      linux/arm64:
        url: "https://github.com/akitaonrails/ai-memory/releases/download/v1.29.0/ai-memory-linux-aarch64.tar.gz"
        sha256: "828cb63f697f8b773d4e6c41c38d0d850310afed04f37479bb48e3a11969d689"
    server_image:
      reference: "akitaonrails/ai-memory@sha256:1d8a2ca7d7bc2349ba964d2d97dafb683632676460c1e373083f919a18c60d37"
      tag_for_humans: "1.29.0"
    notes:
      - "1.29.0 supersedes the prompt's 1.28.1 floor and publishes per-architecture checksums."
      - "Hooks must spool/best-effort and always allow the primary agent to continue when the server is offline."

  - name: ruflo
    role: [client]
    package: ruflo
    validated_version: "3.38.12"
    minimum_version: "3.38.12"
    license: MIT
    source: "https://www.npmjs.com/package/ruflo/v/3.38.12"
    upstream_repository: "https://github.com/ruvnet/ruflo"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: isolated_npm_prefix
    runtime_requirement: "Node.js >=20"
    checksum_strategy: npm_registry_integrity
    integrity: "sha512-NOQnhI/fKok9aM0c+NR/6r6K81LJIO9ZwX7UZUJqIZFU/jg8edMX2qvQVaJfh+wdGCWP7oCdZyxjnNn/5MVr0Q=="
    package_url: "https://registry.npmjs.org/ruflo/-/ruflo-3.38.12.tgz"
    safe_default_features:
      - coordination
      - hierarchical_swarm_lifecycle
      - opaque_task_lifecycle
      - workflows_without_direct_provider_calls
      - hooks
      - ephemeral_operational_state
    disabled_default_features:
      - agent_execute
      - direct_provider_inference
      - durable_memory
    notes:
      - "A reviewed npm v3 lock pins Ruflo and every transitive version, URL and integrity value."
      - "Production uses npm ci with lifecycle scripts disabled and a minimal credential-free environment."
      - "Open upstream issues #2356 and #2962 show agent_execute still requires a separately configured provider."
      - "No OPENAI_API_KEY or ANTHROPIC_API_KEY is requested by ivoai's default Ruflo profile."
      - "Session workers are official Codex/Claude CLI subprocesses; Ruflo receives only opaque lifecycle IDs and never delegation prompts or results."

  - name: nodejs
    role: [client-runtime]
    validated_version: "22.18.0"
    minimum_version: "22.18.0"
    license: MIT
    source: "https://nodejs.org/download/release/v22.18.0/"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: verified_isolated_archive
    checksum_strategy: upstream_sha256
    assets:
      linux/amd64:
        url: "https://nodejs.org/dist/v22.18.0/node-v22.18.0-linux-x64.tar.gz"
        sha256: "a2e703725d8683be86bb5da967bf8272f4518bdaf10f21389e2b2c9eaeae8c8a"
      linux/arm64:
