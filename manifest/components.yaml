schema_version: 1
validated_at: "2026-10-12"
transitive_dependency_cutoff: "2026-10-12T00:00:00Z"
policy:
  allow_latest_tags: false
  update_command: "ivoai update"
  supported_client_platforms:
    - linux/amd64
    - linux/arm64
  supported_server_platforms:
    - linux/amd64
    - linux/arm64

components:
  - name: mcp-go-sdk
    role: [server]
    validated_version: "1.8.0"
    minimum_version: "1.8.0"
    license: "Apache-2.0 / MIT (file-specific)"
    source: "https://github.com/modelcontextprotocol/go-sdk/releases/tag/v1.8.0"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: statically_linked_go_module
    checksum_strategy: go_sum
    notes:
      - "Provides the official stateless Streamable HTTP transport and protocol implementation for the public Web MCP endpoint."

  - name: ivoai
    role: [client, server]
    validated_version: "0.12.0"
    minimum_version: "0.1.0"
    license: MIT
    source: "https://github.com/ivo-lopes/ivoai"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: github_release_asset
    checksum_strategy: release_sha256sums

  - name: go-toolchain
    role: [development-bootstrap]
    validated_version: "1.27.3"
    minimum_version: "1.27.3"
    license: BSD-3-Clause
    source: "https://go.dev/dl/"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: ephemeral_source_build_toolchain
    checksum_strategy: official_archive_sha256
    assets:
      linux/amd64:
        url: "https://go.dev/dl/go1.27.3.linux-amd64.tar.gz"
        sha256: "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40"
      linux/arm64:
        url: "https://go.dev/dl/go1.27.3.linux-arm64.tar.gz"
        sha256: "a06e99309dbcbdca1a8ccd2282c3ee146e55930886e26b4f1193269587165f49"
    notes:
      - "Used only when installing from a source checkout without a compatible system Go; extracted under the installer temporary directory and removed after the build."

  - name: codex
    role: [client]
    package: "@openai/codex"
    validated_version: "0.162.1"
    minimum_version: "0.148.0"
    license: Apache-2.0
    source: "https://github.com/openai/codex/releases/tag/rust-v0.162.1"
    documentation: "https://learn.chatgpt.com/docs/codex/cli"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: github_release_asset
    checksum_strategy: reviewed_release_asset_sha256
    assets:
      linux/amd64:
        url: "https://github.com/openai/codex/releases/download/rust-v0.162.1/codex-x86_64-unknown-linux-musl.tar.gz"
        sha256: "86f268d81b898f3e144c5ecff2ad2fda2c5802e042d6195b72538fe0fa125057"
      linux/arm64:
        url: "https://github.com/openai/codex/releases/download/rust-v0.162.1/codex-aarch64-unknown-linux-musl.tar.gz"
        sha256: "bf3ca2719f1143b1440fbd85c149379e696c782c50ad7991f8bfcec60b2600c1"
    auth:
      default: "codex login"
      status: "codex login status"
      subscription_supported: true
      payg_key_required: false

  - name: claude-code
    role: [client]
    package: "@anthropic-ai/claude-code"
    validated_version: "2.1.296"
    observed_latest_version: "2.1.296"
    minimum_version: "2.1.296"
    license: Proprietary-Anthropic-Terms
    source: "https://github.com/anthropics/claude-code/releases/tag/v2.1.296"
    documentation: "https://code.claude.com/docs/en/getting-started"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: github_release_asset
    checksum_strategy: reviewed_release_asset_sha256
    signing_key_fingerprint: "31DD DE24 DDFA B679 F42D 7BD2 BAA9 29FF 1A7E CACE"
    assets:
      linux/amd64:
        url: "https://github.com/anthropics/claude-code/releases/download/v2.1.296/claude-linux-x64.tar.gz"
        sha256: "45fe2b33f5cbdd114309618970bcd90b8b163e34252d66cf100d7e068d9b831d"
      linux/arm64:
        url: "https://github.com/anthropics/claude-code/releases/download/v2.1.296/claude-linux-arm64.tar.gz"
        sha256: "c644ad3e5ca3367e75d198194189d13180f33c491304c2d19557f7c1e8d5e0a6"
    auth:
      default: "claude auth login"
      subscription_supported: true
      payg_key_required: false
    notes:
      - "Pinned to the reviewed official v2.1.296 release."
      - "ivoai must disable Claude's silent auto-update for a managed install and update only through ivoai update."

  - name: codex-code-mode-host
    role: [client]
    package: "@openai/codex companion"
    validated_version: "0.162.1"
    minimum_version: "0.148.0"
    license: Apache-2.0
    source: "https://github.com/openai/codex/releases/tag/rust-v0.162.1"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: github_release_asset_when_codex_is_managed
    checksum_strategy: github_release_asset_digest_sha256
    assets:
      linux/amd64:
        url: "https://github.com/openai/codex/releases/download/rust-v0.162.1/codex-code-mode-host-x86_64-unknown-linux-musl.tar.gz"
        sha256: "458239ea45c1fc508d89695f180ab352f2834709a8a46929a4466f4f04399ada"
      linux/arm64:
        url: "https://github.com/openai/codex/releases/download/rust-v0.162.1/codex-code-mode-host-aarch64-unknown-linux-musl.tar.gz"
        sha256: "1395ce9367f8acd280674dff083edf25bf221d908b8351d5bd4f3fdde9181e9a"
    notes:
      - "Installed beside managed Codex because the stable Code Mode tool router fails closed when the companion is absent."
      - "The companion has no --version endpoint; compatibility is pinned to the exact Codex release and verified by the reviewed archive digest."

  - name: headroom
    role: [client]
    package: "headroom-ai[proxy]"
    validated_version: "0.40.0"
    minimum_version: "0.40.0"
    license: Apache-2.0
    source: "https://github.com/headroomlabs-ai/headroom/releases/tag/v0.40.0"
    documentation: "https://headroomlabs-ai.github.io/headroom/cli/"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: isolated_python_tool
    runtime_requirement: "Python >=3.10"
    checksum_strategy: pypi_sha256
    assets:
      linux/amd64:
        filename: "headroom_ai-0.40.0-cp310-abi3-manylinux_2_28_x86_64.whl"
        url: "https://github.com/headroomlabs-ai/headroom/releases/download/v0.40.0/headroom_ai-0.40.0-cp310-abi3-manylinux_2_28_x86_64.whl"
        sha256: "49b6d8a01c8eceb5b9e9a675720ed5e4cb24e467282642653aac7f2fd8faf47f"
      linux/arm64:
        filename: "headroom_ai-0.40.0-cp310-abi3-manylinux_2_28_aarch64.whl"
        url: "https://github.com/headroomlabs-ai/headroom/releases/download/v0.40.0/headroom_ai-0.40.0-cp310-abi3-manylinux_2_28_aarch64.whl"
        sha256: "140811066bfb7afe888f471be4a587375779af9de8dd76bb9a8126b52b8e930f"
    notes:
      - "Use headroom wrap codex/claude only after a local compatibility probe; direct-agent fallback is mandatory."
      - "Architecture-specific transitive constraints and hashes are embedded; uv installs wheels against exact CPython 3.14.8."

  - name: caveman
    role: [client]
    validated_version: "2.1.0"
    product_release: "v3.2.0"
    product_revision: "e20f07e8152a0c0360f58c09e79d30ac94329991"
    runtime_revision: "e20f07e8152a0c0360f58c09e79d30ac94329991"
    minimum_version: "2.1.0"
    license: Apache-2.0
    source: "https://github.com/JuliusBrussee/caveman/releases/tag/bin-v2.1.0"
    documentation: "https://github.com/JuliusBrussee/caveman/blob/v3.2.0/README.md"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: managed_supply_chain_raw_binary
    checksum_strategy: upstream_checksums_asset_sha256
    assets:
      linux/amd64:
        url: "https://github.com/JuliusBrussee/caveman/releases/download/bin-v2.1.0/caveman-proxy_linux_amd64"
        sha256: "44436d69705ad9968563c181cd11d396d6ae5eeccd8dbf228f6225d92dfadcb1"
      linux/arm64:
        url: "https://github.com/JuliusBrussee/caveman/releases/download/bin-v2.1.0/caveman-proxy_linux_arm64"
        sha256: "5a881979934d51822ccf9ea13c519769fea18c52c061e14e6bd0d9f950ce760f"
    notes:
      - "Only the proxy/runtime pair is managed; other upstream executables are not installed."
      - "The upstream checksums.txt.keysig is recorded as published but is not claimed as independently verified."
      - "Caveman 3.x and runtime bin-v2.1.0 use Apache-2.0; preserve upstream NOTICE and historical MIT attribution."
      - "No Caveman memory, MCP, browse, learn, pixel, hooks, statusline or global setup is enabled."

  - name: caveman-mcp
    role: [client]
    validated_version: "2.1.0"
    runtime_revision: "e20f07e8152a0c0360f58c09e79d30ac94329991"
    minimum_version: "2.1.0"
    license: Apache-2.0
    source: "https://github.com/JuliusBrussee/caveman/releases/tag/bin-v2.1.0"
    documentation: "https://github.com/JuliusBrussee/caveman/blob/v3.2.0/README.md"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: managed_supply_chain_raw_binary
    checksum_strategy: upstream_checksums_asset_sha256
    requires_managed: caveman
    assets:
      linux/amd64:
        url: "https://github.com/JuliusBrussee/caveman/releases/download/bin-v2.1.0/caveman-mcp_linux_amd64"
        sha256: "24339e645da66fb3580e3d9410743499845748238f01d0dc8097330fcb0f9bde"
      linux/arm64:
        url: "https://github.com/JuliusBrussee/caveman/releases/download/bin-v2.1.0/caveman-mcp_linux_arm64"
        sha256: "fb49b996eee5a297a674a067979931d9a28d59cbe735be2b9104e7519ef7042a"
    notes:
      - "Local-only stdio helper used internally by WorkingContext; it is never registered automatically with the primary."
      - "No npx, global install, durable memory, browse, learn, pixel or external service is used."

  - name: opencode
    role: [client]
    validated_version: "1.19.0"
    minimum_version: "1.19.0"
    revision: "733b2c627e5aec39cb33cc22373bdce33053ef2c"
    default_branch: dev
    license: MIT
    source: "https://github.com/anomalyco/opencode/releases/tag/v1.19.0"
    documentation: "https://opencode.ai/docs/"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: managed_supply_chain_release_archive
    checksum_strategy: github_release_asset_digest_sha256
    assets:
      linux/amd64:
        url: "https://github.com/anomalyco/opencode/releases/download/v1.19.0/opencode-linux-x64.tar.gz"
        sha256: "7bb9e61ad6feacf2e89c10a6a2c1840e3de4220bb50ba1fc7110f31806076aec"
      linux/arm64:
        url: "https://github.com/anomalyco/opencode/releases/download/v1.19.0/opencode-linux-arm64.tar.gz"
        sha256: "e9841d43d3e1a8f36ed2691592d3b8b4fb097e606c8b559a277a1b845840e26b"
    auth:
      default: "opencode auth login"
      subscription_or_provider_owned: true
      payg_key_required_by_ivoai: false
    notes:
      - "Authentication remains entirely owned by OpenCode; IVOAI never reads or persists its auth store."
      - "Direct primary sessions are supported; AUTO/worker use is deferred to IVOAI-22."

  - name: ai-memory
    role: [client, server]
    validated_version: "2.6.3"
    minimum_version: "2.6.3"
    license: MIT
    source: "https://github.com/akitaonrails/ai-memory/releases/tag/v2.6.3"
    changelog: "https://github.com/akitaonrails/ai-memory/blob/v2.6.3/CHANGELOG.md"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: github_release_asset
    checksum_strategy: adjacent_upstream_sha256
    assets:
      linux/amd64:
        url: "https://github.com/akitaonrails/ai-memory/releases/download/v2.6.3/ai-memory-linux-x86_64.tar.gz"
        sha256: "933be9bb8fe6930336933f0b8adf0695007e644f945898f9f030fd312326f0f3"
      linux/arm64:
        url: "https://github.com/akitaonrails/ai-memory/releases/download/v2.6.3/ai-memory-linux-aarch64.tar.gz"
        sha256: "e4e01409fe80148a4d561aef98ac5d526c488c4a621faa759f9d0b3ed2606088"
    server_image:
      reference: "akitaonrails/ai-memory@sha256:15178d3fc5bd67439a5b9780b2cf58af476943abea2487514a4c5d6ec18291ee"
      tag_for_humans: "2.6.3"
    notes:
      - "Client and server are pinned to the reviewed 2.6.3 release; back up server data before migration."
      - "Hooks must spool/best-effort and always allow the primary agent to continue when the server is offline."

  - name: graft
    role: [client-runtime]
    validated_version: "0.21.1-ivoai.1"
    upstream_version: "0.21.1"
    minimum_version: "0.21.1-ivoai.1"
    license: MIT
    source: "https://github.com/trailhq/Graft"
    upstream_revision: "fe30ead39d5e6f0c921018d364da2bdbc9d4b3ad"
    source_archive: "https://codeload.github.com/trailhq/Graft/tar.gz/fe30ead39d5e6f0c921018d364da2bdbc9d4b3ad"
    source_sha256: "ab27f9123eeb59b3987a342a24b7e357ad3412f41c556fde3a76ca9e250d2db1"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: managed_supply_chain_archive
    runtime_requirement: "Private Node.js 26.11.1"
    checksum_strategy: compiled_release_archive_sha256
    trust_level: checksum_only
    signature_status: not_exposed
    attestation_status: not_exposed
    transitive_license_inventory: "patches/graft/grammar-licenses/inventory.json"
    managed_archive_pattern: "ivoai-graft_linux_<arch>.tar.gz"
    managed_payload_path: graft-runtime
    health_probe: "graft-runtime --version"
    notes:
      - "Only IVOAI-published release artifacts with compiled version/platform/source/patch/archive identity are installable; development builds without metadata omit Graft and diagnose its absence."
      - "The managed object contains the version-only sentinel, dist, reviewed node_modules, LICENSE and provenance inventories. No upstream CLI or npm lifecycle command runs during installation."
      - "The existing supply-chain limits, integrity checks, promotion and rollback apply; no upstream signature verification is claimed."

  - name: ruflo
    role: [client]
    package: ruflo
    validated_version: "3.56.5"
    minimum_version: "3.56.5"
    license: MIT
    source: "https://www.npmjs.com/package/ruflo/v/3.56.5"
    upstream_repository: "https://github.com/ruvnet/ruflo"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: isolated_npm_prefix
    runtime_requirement: "Node.js >=20"
    checksum_strategy: npm_registry_integrity
    integrity: "sha512-t80LC6aqtdRLDgv0wSrsV4VjBeYsnvKNUy8rH9tMxBZTVM83IDh3uKNgg5jA3hBixWz8k+3Eq6eUHO15MslMNQ=="
    package_url: "https://registry.npmjs.org/ruflo/-/ruflo-3.56.5.tgz"
    safe_default_features:
      - coordination
      - hierarchical_swarm_lifecycle
      - opaque_task_lifecycle
      - workflows_without_direct_provider_calls
      - hooks
      - ephemeral_operational_state
    disabled_default_features:
      - agent_execute
      - direct_provider_inference
      - durable_memory
    notes:
      - "A reviewed npm v3 lock pins Ruflo and every transitive version, URL and integrity value."
      - "Production uses npm ci with lifecycle scripts disabled and a minimal credential-free environment."
      - "Open upstream issues #2356 and #2962 show agent_execute still requires a separately configured provider."
      - "No OPENAI_API_KEY or ANTHROPIC_API_KEY is requested by ivoai's default Ruflo profile."
      - "Session workers are official Codex/Claude CLI subprocesses; Ruflo receives only opaque lifecycle IDs and never delegation prompts or results."

  - name: nodejs
    role: [client-runtime]
    validated_version: "26.11.1"
    minimum_version: "26.11.1"
    license: MIT
    source: "https://nodejs.org/download/release/v26.11.1/"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: verified_isolated_archive
    checksum_strategy: upstream_sha256
    assets:
      linux/amd64:
        url: "https://nodejs.org/dist/v26.11.1/node-v26.11.1-linux-x64.tar.gz"
        sha256: "15fc043a51a5783f2f4b634561091658f5a7f0e3db03f997dca3a8033a33e45b"
      linux/arm64:
        url: "https://nodejs.org/dist/v26.11.1/node-v26.11.1-linux-arm64.tar.gz"
        sha256: "170454fb022f5e9b5f6cc76c25fa32ef5100895be44eb04e92f9780591491bbf"
    notes:
      - "Private runtime for the pinned Ruflo and managed Graft installations; it does not modify the user's global Node.js setup."
      - "Official Node 26 Linux binaries require the system libatomic runtime (libatomic1 on Debian/Ubuntu), glibc >=2.28 and libstdc++ >=6.0.25."

  - name: uv
    role: [client-runtime]
    validated_version: "0.13.0"
    minimum_version: "0.13.0"
    license: Apache-2.0-or-MIT
    source: "https://github.com/astral-sh/uv/releases/tag/0.13.0"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: verified_isolated_archive
    checksum_strategy: upstream_sha256
    assets:
      linux/amd64:
        url: "https://github.com/astral-sh/uv/releases/download/0.13.0/uv-x86_64-unknown-linux-gnu.tar.gz"
        sha256: "1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154"
      linux/arm64:
        url: "https://github.com/astral-sh/uv/releases/download/0.13.0/uv-aarch64-unknown-linux-gnu.tar.gz"
        sha256: "3ccfb6af6e242433eb552f7d9676abd5412c6595c497e990d9c8cb7b5bd4d2c3"
    notes:
      - "Private runtime for Headroom; it does not modify the user's global Python tooling."
      - "Headroom's architecture-specific hashed constraints are generated with this pinned uv and the manifest cutoff."

  - name: python-runtime
    role: [client-runtime]
    project: CPython
    validated_version: "3.14.8"
    minimum_version: "3.14.8"
    license: PSF-2.0
    source: "https://www.python.org/downloads/release/python-3148/"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: uv_managed_python
    checksum_strategy: uv_managed_runtime_metadata
    notes:
      - "ivoai requests exactly 3.14.8 through the pinned uv runtime and keeps it below the ivoai data root."
      - "The platform-specific managed Python artifact is selected and verified by pinned uv and is not bundled in ivoai release archives."

  - name: qdrant
    role: [server]
    validated_version: "1.19.2"
    minimum_version: "1.19.2"
    license: Apache-2.0
    source: "https://github.com/qdrant/qdrant/releases/tag/v1.19.2"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: docker_compose_internal_network
    checksum_strategy: oci_digest
    image:
      reference: "qdrant/qdrant@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad"
      tag_for_humans: "v1.19.2"
    exposure: internal_only

  - name: docker-engine
    role: [server-runtime]
    project: Docker Engine
    validated_version: "29.7.2"
    minimum_version: "28.0.0"
    license: Apache-2.0
    source: "https://docs.docker.com/engine/release-notes/29/"
    documentation: "https://docs.docker.com/engine/release-notes/28/"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: operator_managed_official_repository
    checksum_strategy: operating_system_package_manager
    notes:
      - "Engine 28 introduced gateway priority, which keeps model-download egress deterministic while backend publication networks remain non-masqueraded."
      - "Setup validates the daemon version but does not replace an existing Engine installation that may own unrelated containers."

  - name: docker-compose
    role: [server-runtime]
    project: Docker Compose
    validated_version: "5.6.0"
    minimum_version: "5.6.0"
    license: Apache-2.0
    source: "https://github.com/docker/compose/releases/tag/v5.6.0"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: verified_system_cli_plugin_fallback
    checksum_strategy: upstream_sha256
    assets:
      linux/amd64:
        url: "https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-linux-x86_64"
        sha256: "40343e21ca777173e69cff5dbafeb37c6f81f3b0d57d9e597f036e95eb63e76a"
      linux/arm64:
        url: "https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-linux-aarch64"
        sha256: "733ec76717ceb59052a9609b9dadfb523b2df8eab57a54212872d10a58078ea2"
    notes:
      - "An existing compatible Compose installation is preserved. When Compose is absent or older than 2.33.1, setup installs this verified official binary under /usr/local/lib/docker/cli-plugins."

  - name: embedding-runtime
    role: [server]
    project: text-embeddings-inference
    validated_version: "1.9.4"
    minimum_version: "1.9.4"
    license: Apache-2.0
    source: "https://github.com/huggingface/text-embeddings-inference/releases/tag/v1.9.4"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: docker_compose_internal_network
    checksum_strategy: per_architecture_oci_digest
    images:
      linux/amd64:
        reference: "ghcr.io/huggingface/text-embeddings-inference@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d"
        upstream_tag: "cpu-1.9.4"
      linux/arm64:
        reference: "ghcr.io/huggingface/text-embeddings-inference@sha256:798cd7615e060a72ccbdf19aa0ada52289c6a0147490195bafaece6ce04d70f1"
        upstream_tag: "cpu-arm64-1.9.4"
    exposure: internal_only
    notes:
      - "Both CPU tags were resolved to immutable OCI indexes and their target platforms verified."

  - name: embedding-model
    role: [server]
    project: intfloat/multilingual-e5-small
    validated_version: "614241f622f53c4eeff9890bdc4f31cfecc418b3"
