    notes:
      - "The arm64 OCI index digest was reviewed from upstream tag cpu-arm64-sha-30507cb; the shortened platform manifest digest is informational and the full index digest is the install pin."

  - name: embedding-model
    role: [server]
    project: intfloat/multilingual-e5-small
    validated_version: "614241f622f53c4eeff9890bdc4f31cfecc418b3"
    minimum_version: "614241f622f53c4eeff9890bdc4f31cfecc418b3"
    license: MIT
    source: "https://huggingface.co/intfloat/multilingual-e5-small/tree/614241f622f53c4eeff9890bdc4f31cfecc418b3"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: huggingface_snapshot
