        sha256: "d415eeea90a2fdb60c66dd386b258acbfc4d1fa4720a8df5dea7369fbdbcddee"
    notes:
      - "Private runtime for the pinned Ruflo installation; it does not modify the user's global Node.js setup."

  - name: uv
    role: [client-runtime]
    validated_version: "0.12.5"
    minimum_version: "0.12.5"
    license: Apache-2.0-or-MIT
    source: "https://github.com/astral-sh/uv/releases/tag/0.12.5"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: verified_isolated_archive
    checksum_strategy: upstream_sha256
    assets:
      linux/amd64:
        url: "https://github.com/astral-sh/uv/releases/download/0.12.5/uv-x86_64-unknown-linux-gnu.tar.gz"
        sha256: "68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2"
      linux/arm64:
        url: "https://github.com/astral-sh/uv/releases/download/0.12.5/uv-aarch64-unknown-linux-gnu.tar.gz"
        sha256: "9bf43b4d1a07665bf64d4c4e710930b382321a785e0eb10aac07f46471f86a31"
    notes:
      - "Private runtime for Headroom; it does not modify the user's global Python tooling."
      - "Headroom's architecture-specific hashed constraints are generated with this pinned uv and the manifest cutoff."

  - name: python-runtime
    role: [client-runtime]
    project: CPython
    validated_version: "3.13.15"
    minimum_version: "3.13.15"
    license: PSF-2.0
    source: "https://www.python.org/downloads/release/python-31315/"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: uv_managed_python
    checksum_strategy: uv_managed_runtime_metadata
    notes:
      - "ivoai requests exactly 3.13.15 through the pinned uv runtime and keeps it below the ivoai data root."
      - "The platform-specific managed Python artifact is selected and verified by pinned uv and is not bundled in ivoai release archives."

  - name: qdrant
    role: [server]
    validated_version: "1.19.0"
    minimum_version: "1.19.0"
    license: Apache-2.0
    source: "https://github.com/qdrant/qdrant/releases/tag/v1.19.0"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: docker_compose_internal_network
    checksum_strategy: oci_digest
    image:
      reference: "qdrant/qdrant@sha256:a0e04fe623cb064502cd869cefc1dc7ce359d8edd481063b5bd351c0a0a2c91e"
      tag_for_humans: "v1.19.0"
    exposure: internal_only

  - name: docker-engine
    role: [server-runtime]
    project: Docker Engine
    validated_version: "29.7.2"
    minimum_version: "28.0.0"
    license: Apache-2.0
    source: "https://docs.docker.com/engine/release-notes/29/"
    documentation: "https://docs.docker.com/engine/release-notes/28/"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: operator_managed_official_repository
    checksum_strategy: operating_system_package_manager
    notes:
      - "Engine 28 introduced gateway priority, which keeps model-download egress deterministic while backend publication networks remain non-masqueraded."
      - "Setup validates the daemon version but does not replace an existing Engine installation that may own unrelated containers."

  - name: docker-compose
    role: [server-runtime]
    project: Docker Compose
    validated_version: "5.5.0"
    minimum_version: "5.5.0"
    license: Apache-2.0
    source: "https://github.com/docker/compose/releases/tag/v5.5.0"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: verified_system_cli_plugin_fallback
    checksum_strategy: upstream_sha256
    assets:
      linux/amd64:
        url: "https://github.com/docker/compose/releases/download/v5.5.0/docker-compose-linux-x86_64"
        sha256: "c57ab918abd5b05ca7e7d0f275875dd1330a695074f309dc9eab1b49efafcd4b"
      linux/arm64:
        url: "https://github.com/docker/compose/releases/download/v5.5.0/docker-compose-linux-aarch64"
        sha256: "ff42489f5a9b879d5d117c5ffea6defc27390b3286da8ad52cbc9c6ab5df590e"
    notes:
      - "An existing compatible Compose installation is preserved. When Compose is absent or older than 2.33.1, setup installs this verified official binary under /usr/local/lib/docker/cli-plugins."

  - name: embedding-runtime
    role: [server]
    project: text-embeddings-inference
    validated_version: "1.9.3"
    minimum_version: "1.9.3"
    license: Apache-2.0
    source: "https://github.com/huggingface/text-embeddings-inference/releases/tag/v1.9.3"
    architectures: [linux/amd64, linux/arm64]
    install_strategy: docker_compose_internal_network
    checksum_strategy: per_architecture_oci_digest
    images:
      linux/amd64:
        reference: "ghcr.io/huggingface/text-embeddings-inference@sha256:ad950d30878eceb72aaf32024d26fa2b1d04a75304fa0b4776b49aa1941fea07"
        source_revision: "06670157fb6c1523482219bdb2d1660277d38088"
      linux/arm64:
        reference: "ghcr.io/huggingface/text-embeddings-inference@sha256:2873ddd3029bf6eed09c0befe737d88123107a0b89274b1552d68d1e3bb2a047"
        upstream_tag: "cpu-arm64-sha-30507cb"
        platform_manifest_digest: "sha256:bf03cea"
