services:
  qdrant:
    image: qdrant/qdrant@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    restart: unless-stopped
    user: "1000:1000"
    env_file: [/etc/ivoai/secrets/qdrant.env]
    environment:
      QDRANT_INIT_FILE_PATH: /qdrant/init/.qdrant-initialized
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - /var/lib/ivoai/qdrant:/qdrant/storage
      - /var/lib/ivoai/qdrant-snapshots:/qdrant/snapshots
      - /var/lib/ivoai/qdrant-init:/qdrant/init
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; IFS= read -r status <&3; [[ $$status == *' 200 '* ]]"]
      interval: 10s
      timeout: 3s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    networks: [ivoai-internal, host-publish]

  embeddings:
    container_name: ivoai-embeddings
    image: ghcr.io/huggingface/text-embeddings-inference@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    restart: unless-stopped
    user: "1000:1000"
    env_file: [/etc/ivoai/secrets/embeddings.env]
    command: ["--model-id", "intfloat/multilingual-e5-small", "--revision", "614241f622f53c4eeff9890bdc4f31cfecc418b3", "--port", "80"]
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - /var/lib/ivoai/models:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Authorization: Bearer '$$API_KEY http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 3s
      retries: 30
      # The first CPU-only model download can exceed five minutes on a clean
      # host. Successful probes still end this grace period immediately.
      start_period: 10m
    security_opt: ["no-new-privileges:true"]
    networks:
      ivoai-internal: {}
      host-publish: {}
      # Force the only masqueraded network to be the startup default route.
      # systemd disconnects it immediately after the model is healthy.
      model-download:
        gw_priority: 1

  ai-memory:
    image: akitaonrails/ai-memory@sha256:15178d3fc5bd67439a5b9780b2cf58af476943abea2487514a4c5d6ec18291ee
    restart: unless-stopped
    command: ["serve", "--transport", "http", "--bind", "0.0.0.0:49374"]
    user: "1000:1000"
    env_file: [/etc/ivoai/secrets/memory.env]
    ports:
      - "127.0.0.1:49374:49374"
    volumes:
      - /var/lib/ivoai/memory:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/ai-memory", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [ivoai-internal, host-publish]

networks:
  ivoai-internal:
    internal: true
  # Docker silently omits published ports for containers attached only to an
  # internal network. This transient network creates the loopback bindings;
  # systemd disconnects it after startup so backends have no runtime egress.
  host-publish:
    name: ivoai-host-publish
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  model-download:
    name: ivoai-model-download
